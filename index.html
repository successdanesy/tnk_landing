<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Production URL (Vercel redirects the apex tnklabs.online to www) -->
    <link rel="canonical" href="https://www.tnklabs.online/" />

    <title>TNK LABS - Building the Presence Behind the Founder</title>

      name="description"

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"

      rel="preload"

    />

      rel="preload"
      as="image"
      href="/photos/hero-mobile.webp"
      type="image/webp"
