<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Production URL (Vercel redirects the apex tnklabs.online to www) -->
    <link rel="canonical" href="https://www.tnklabs.online/" />

    <title>TNK Labs - AI-Powered Ad Creation &amp; Paid Advertising</title>
    <meta
      name="description"
      content="TNK Labs is an AI-powered advertising agency creating compelling video ads and running strategic paid advertising campaigns that help businesses reach the right audience, generate leads and drive sales."
    />
    <meta
      name="keywords"
      content="AI video ads, AI ad creation, paid advertising agency, ad creative strategy, campaign optimization, video ads for businesses, Nigeria advertising agency"
    />
    <meta name="author" content="TNK LABS" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#f4c02a" />
    <meta name="color-scheme" content="light" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Manrope is self-hosted and bundled into the app CSS (see src/main.tsx) -->

    <!-- LCP image hint -->
    <link
      rel="preload"
      as="image"
      href="/photos/hero.webp"
      type="image/webp"
      media="(min-width: 640px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/photos/hero-mobile.webp"
      type="image/webp"
      media="(max-width: 639px)"
      fetchpriority="high"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TNK LABS" />
    <meta property="og:title" content="TNK Labs - AI-Powered Ad Creation &amp; Paid Advertising" />
    <meta
      property="og:description"
      content="TNK Labs is an AI-powered advertising agency creating compelling video ads and running strategic paid advertising campaigns that help businesses reach the right audience, generate leads and drive sales."
    />
    <meta property="og:url" content="https://www.tnklabs.online/" />
    <meta property="og:image" content="https://www.tnklabs.online/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TNK Labs - AI-powered ad creation and paid advertising" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TNK Labs - AI-Powered Ad Creation &amp; Paid Advertising" />
    <meta
      name="twitter:description"
      content="AI-powered video ads and strategic paid advertising that help businesses reach more customers and grow."
    />
    <meta name="twitter:image" content="https://www.tnklabs.online/og-image.png" />
    <meta name="twitter:site" content="@tnklabss" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "TNK LABS",
        "alternateName": "Tnklabs",
        "url": "https://www.tnklabs.online/",
        "logo": "https://www.tnklabs.online/favicon.png",
        "description": "AI-powered advertising agency for AI video ad creation and paid advertising.",
        "email": "tnklabss@gmail.com",
        "sameAs": [
          "https://www.linkedin.com/company/tnklabs/",
          "https://x.com/tnklabss"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
